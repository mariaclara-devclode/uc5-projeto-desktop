<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gerenciador de Estoque Comercial</title>
  </head>
  <body>

  <div id="app">

    <h1>Gerenciador de Estoque Comercial</h1>

    <!-- MENU DE TELAS -->

    <select id="menu-tela">

      <option value="produtos">
        Produtos
      </option>

      <option value="categorias">
        Categorias
      </option>

      <option value="cadastro">
        Cadastro
      </option>

      <option value="movimentacoes">
        Movimentações
      </option>

    </select>


    <!TELA PRODUTOS >

    <section id="tela-produtos">

      <h2>Produtos</h2>

      <button id="btn-produtos">
        Listar Produtos
      </button>

      <button id="btn-criticos">
        Estoque Crítico
      </button>

      <br>

      <input
        id="campo-busca"
        type="text"
        placeholder="Buscar por ID, nome ou código"
      >

      <button id="btn-buscar">
        Buscar
      </button>

      <button id="btn-limpar">
        Limpar
      </button>

      <p id="resposta"></p>

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Código</th>
            <th>Preço</th>
            <th>Categoria</th>
            <th>Estoque</th>
            <th>Status</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody id="tabela-produtos"></tbody>

      </table>

    </section>


    <!TELA CATEGORIAS >

    <section id="tela-categorias">

      <h2>Categorias</h2>

      <form id="form-categoria">

        <input
          id="categoria-nome"
          type="text"
          placeholder="Nome da categoria"
          required
        >

        <input
          id="categoria-descricao"
          type="text"
          placeholder="Descrição"
          required
        >

        <button type="submit">
          Cadastrar Categoria
        </button>

      </form>

      <p id="resposta-categoria"></p>

      <table>

        <thead>

          <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Ações</th>
          </tr>

        </thead>

        <tbody id="tabela-categorias"></tbody>

      </table>

    </section>


    <!TELA CADASTRO >

    <section id="tela-cadastro">

      <h2>Cadastrar Produto</h2>

      <form id="form-produto">

        <input
          id="produto-nome"
          type="text"
          placeholder="Nome do produto"
          required
        >

        <input
          id="produto-codigo"
          type="text"
          placeholder="Código de barras"
          required
        >

        <input
          id="produto-preco"
          type="number"
          step="0.01"
          min="0"
          placeholder="Preço de venda"
          required
        >

        <select
          id="produto-categoria"
          required
        >

          <option value="">
            Selecione uma categoria
          </option>

        </select>

        <button type="submit">
          Cadastrar Produto
        </button>

      </form>

      <p id="resposta-produto"></p>

    </section>


    <! TELA MOVIMENTAÇÕES >

    <section id="tela-movimentacoes">

      <h2>Registrar Movimentação</h2>

      <form id="form-movimentacao">

        <select
          id="movimentacao-produto"
          required
        >

          <option value="">
            Selecione um produto
          </option>

        </select>

        <input
          id="movimentacao-quantidade"
          type="number"
          min="1"
          placeholder="Quantidade"
          required
        >

        <select
          id="movimentacao-tipo"
          required
        >

          <option value="">
            Selecione o tipo
          </option>

          <option value="entrada">
            Entrada
          </option>

          <option value="saida">
            Saída
          </option>

        </select>

        <button type="submit">
          Registrar Movimentação
        </button>

      </form>

      <p id="resposta-movimentacao"></p>

    </section>

  </div>

  <script type="module" src="/src/renderer.ts"></script>

</body>
  
</html>
