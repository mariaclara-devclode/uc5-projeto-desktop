<!doctype html>
<html lang="pt-BR">

  <head>

    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />

    <link
      rel="stylesheet"
      href="/src/style.css"
    />

    <title>
      Gerenciador de Estoque Comercial
    </title>

  </head>


  <body>

    <div id="app">

      <!-- CABEÇALHO -->

      <header class="cabecalho">

        <h1>
          Gerenciador de Estoque Comercial
        </h1>

        <p>
          Sistema de controle de produtos e estoque
        </p>

      </header>


      <!-- NAVEGAÇÃO -->

      <nav class="navegacao">

        <button
          id="btn-voltar"
          type="button"
        >
          ← Voltar
        </button>


        <div class="navegacao-telas">

          <button
            id="nav-produtos"
            type="button"
          >
            Produtos
          </button>


          <button
            id="nav-cadastro"
            type="button"
          >
            Cadastro
          </button>


          <button
            id="nav-categorias"
            type="button"
          >
            Categorias
          </button>


          <button
            id="nav-movimentacoes"
            type="button"
          >
            Movimentações
          </button>

        </div>

      </nav>


      <!-- TELA PRODUTOS -->

      <section id="tela-produtos">

        <h2>
          Produtos
        </h2>


        <button
          id="btn-produtos"
          type="button"
        >
          Listar Produtos
        </button>


        <button
          id="btn-criticos"
          type="button"
        >
          Estoque Crítico
        </button>


        <form id="form-busca">

          <label for="campo-busca">
            Buscar produto
          </label>


          <input
            id="campo-busca"
            type="text"
            placeholder="ID, nome ou código"
          />


          <button
            id="btn-buscar"
            type="submit"
          >
            Buscar
          </button>


          <button
            id="btn-limpar"
            type="button"
          >
            Limpar
          </button>

        </form>


        <p id="erro-busca"></p>

        <p id="resposta"></p>


        <table>

          <thead>

            <tr>

              <th>ID</th>
              <th>Nome</th>
              <th>Código</th>
              <th>Preço</th>
              <th>Categoria</th>
              <th>Estoque</th>
              <th>Status</th>
              <th>Ações</th>

            </tr>

          </thead>


          <tbody
            id="tabela-produtos"
          ></tbody>

        </table>

      </section>


      <!-- TELA CADASTRO -->

      <section id="tela-cadastro">

        <h2 id="titulo-form-produto">
          Cadastrar Produto
        </h2>


        <form id="form-produto">

          <input
            id="produto-nome"
            type="text"
            placeholder="Nome do produto"
            required
          />


          <input
            id="produto-codigo"
            type="text"
            placeholder="Código de barras"
            required
          />


          <input
            id="produto-preco"
            type="number"
            step="0.01"
            min="0"
            placeholder="Preço de venda"
            required
          />


          <select
            id="produto-categoria"
            required
          >

            <option value="">
              Selecione uma categoria
            </option>

          </select>


          <button
            id="btn-salvar-produto"
            type="submit"
          >
            Cadastrar Produto
          </button>


          <button
            id="btn-cancelar-edicao"
            type="button"
          >
            Cancelar edição
          </button>

        </form>


        <p id="resposta-produto"></p>


        <h2>
          Cadastrar Categoria
        </h2>


        <form id="form-categoria">

          <input
            id="categoria-nome"
            type="text"
            placeholder="Nome da categoria"
            required
          />


          <input
            id="categoria-descricao"
            type="text"
            placeholder="Descrição"
            required
          />


          <button
            type="submit"
          >
            Cadastrar Categoria
          </button>

        </form>


        <p id="resposta-categoria"></p>

      </section>


      <!-- TELA CATEGORIAS -->

      <section id="tela-categorias">

        <h2>
          Categorias
        </h2>


        <table>

          <thead>

            <tr>

              <th>ID</th>
              <th>Nome</th>
              <th>Descrição</th>
              <th>Ações</th>

            </tr>

          </thead>


          <tbody
            id="tabela-categorias"
          ></tbody>

        </table>

      </section>


      <!-- TELA MOVIMENTAÇÕES -->

      <section id="tela-movimentacoes">

        <h2>
          Registrar Movimentação
        </h2>


        <form id="form-movimentacao">

          <select
            id="movimentacao-produto"
            required
          >

            <option value="">
              Selecione um produto
            </option>

          </select>


          <input
            id="movimentacao-quantidade"
            type="number"
            min="1"
            placeholder="Quantidade"
            required
          />


          <select
            id="movimentacao-tipo"
            required
          >

            <option value="">
              Selecione o tipo
            </option>


            <option value="entrada">
              Entrada
            </option>


            <option value="saida">
              Saída
            </option>

          </select>


          <button
            type="submit"
          >
            Registrar Movimentação
          </button>

        </form>


        <p id="resposta-movimentacao"></p>

      </section>

    </div>


    <script
      type="module"
      src="/src/renderer.ts"
    ></script>

  </body>

</html>
